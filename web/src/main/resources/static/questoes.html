<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dignitas · Questões</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/paginas.css">
    <script src="js/regras.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/questoes.js" defer></script>
</head>
<body data-page="questoes">
<header class="topbar">
    <a class="brand" href="index.html"><img src="img/dignitas.png" alt=""><strong>Dignitas</strong></a>
    <button class="btn btn-small" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menu</button>
</header>
<div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="brand" href="index.html"><img src="img/dignitas.png" alt=""><div><strong>Dignitas</strong><span>Banco de questões</span></div></a>
        <ul class="nav">
            <li><a href="index.html" data-page="painel"><span class="icon" aria-hidden="true">⌂</span>Painel</a></li>
            <li><a href="questoes.html" data-page="questoes"><span class="icon" aria-hidden="true">☰</span>Questões</a></li>
            <li><a href="editor.html" data-page="editor"><span class="icon" aria-hidden="true">✎</span>Nova questão</a></li>
            <li><a href="praticar.html" data-page="praticar"><span class="icon" aria-hidden="true">▶</span>Praticar</a></li>
            <li><a href="historico.html" data-page="historico"><span class="icon" aria-hidden="true">↺</span>Histórico</a></li>
            <li><a href="estatisticas.html" data-page="estatisticas"><span class="icon" aria-hidden="true">▦</span>Estatísticas</a></li>
            <li><a href="importar.html" data-page="importar"><span class="icon" aria-hidden="true">⇪</span>Importar PDF</a></li>
        </ul>
        <div class="sidebar-footer"><button class="btn btn-small" id="theme-toggle" type="button">Alternar tema</button></div>
    </nav>

    <main class="main" id="conteudo">
        <div class="page-header">
            <div>
                <h1>Questões</h1>
                <p>Busque, filtre e abra as questões do banco.</p>
            </div>
            <a class="btn btn-primary" href="editor.html">Nova questão</a>
        </div>

        <form class="card filtros" id="form-filtros" novalidate>
            <div class="field">
                <label for="f-texto">Buscar no enunciado</label>
                <input type="search" id="f-texto" name="texto" placeholder="Ex.: capital, porcentagem…" autocomplete="off">
                <span class="field-error" id="erro-texto" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="f-disciplina">Disciplina</label>
                <select id="f-disciplina" name="disciplina"><option value="">Todas</option></select>
            </div>
            <div class="field">
                <label for="f-status">Situação</label>
                <select id="f-status" name="status">
                    <option value="todas">Todas</option>
                    <option value="nao-respondidas">Não respondidas</option>
                    <option value="erradas">Que já errei</option>
                    <option value="marcadas">Marcadas para revisão</option>
                </select>
            </div>
            <div class="field">
                <label for="f-ordem">Ordenar por</label>
                <select id="f-ordem" name="ordem">
                    <option value="recentes">Mais recentes</option>
                    <option value="antigas">Mais antigas</option>
                    <option value="numero">Nº da questão</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn" type="reset">Limpar</button>
            </div>
        </form>

        <section class="card mt">
            <div class="card-header">
                <h2 id="titulo-resultado">Resultados</h2>
                <span class="muted" id="contagem" aria-live="polite"></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th class="num">Nº</th><th>Enunciado</th><th>Disciplina</th><th>Origem</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
            <div class="paginacao">
                <button class="btn btn-small" id="anterior" type="button">Anterior</button>
                <span id="pagina-info" class="muted"></span>
                <button class="btn btn-small" id="proxima" type="button">Próxima</button>
            </div>
        </section>
    </main>
</div>
</body>
</html>
