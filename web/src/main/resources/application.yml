server:
  port: 8080

spring:
  application:
    name: dignitas-web
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB

dignitas:
  db:
    # O banco é criado automaticamente se não existir (createDatabaseIfNotExist).
    url: jdbc:mysql://localhost:3306/dignitasdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
    usuario: ${DIGNITAS_DB_USUARIO:root}
    senha: ${DIGNITAS_DB_SENHA:}
    driver: com.mysql.cj.jdbc.Driver
  # Modelos do Tesseract (português) ficam aqui; o download é feito na primeira importação com OCR.
  tessdata-dir: ${user.home}/dignitas/tessdata
